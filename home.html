<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SparkleShop | Premium Celebratory Crackers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. NAVIGATION HEADER -->
    <header class="main-header">
        <div class="logo">✨ VAVPYROPARK</div>
        <nav class="nav-links">
            <a href="home.html">Home</a>
            <a href="index.html">Shop</a>
            <a href="about.html" >About Us</a>
            <a href="safetyguide.html">Safety Guide</a>
           
        </nav>
            <button type="button" class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <nav class="mobile-nav" id="mobileNav" aria-hidden="true">
                <a href="home.html">🏠 Home</a>
                <a href="index.html#shop">🛍️ Shop</a>
                <a href="about.html">ℹ️ About Us</a>
                <a href="safetyguide.html">🛡️ Safety Guide</a>
            </nav>
        <!-- Shopping Cart Trigger Icon -->
        <div class="cart-icon-container" onclick="toggleCart()">
            <span class="cart-emoji">🛒</span>
            <span id="cart-count" class="cart-badge">0</span>
        </div>
    </header>

    <!-- 2. HERO HERO SECTION -->
    <section class="celebration-hero" id="home">
        <div class="hero-text-container">
            <h1>Light Up Your Celebrations Safely</h1>
            <p>Premium quality, eco-friendly crackers delivered straight to your licensed location.</p>
            <div class="hero-buttons">
                <a href="index.html" class="hero-cta-btn">Explore Collection</a>
                <a href="about.html" class="btn-secondary-about">Learn Our Story</a>
            </div>
        </div>
    </section>

    <script id="static-hamburger-script">
    (function () {
        const btn = document.getElementById('hamburgerBtn');
        const nav = document.getElementById('mobileNav');
        if (!btn || !nav) return;
    
        function closeMenu() {
            btn.classList.remove('active');
            btn.setAttribute('aria-expanded', 'false');
            nav.classList.remove('open');
            nav.setAttribute('aria-hidden', 'true');
        }
    
        function openMenu() {
            btn.classList.add('active');
            btn.setAttribute('aria-expanded', 'true');
            nav.classList.add('open');
            nav.setAttribute('aria-hidden', 'false');
        }
    
        btn.addEventListener('click', function (event) {
            event.stopPropagation();
            nav.classList.contains('open') ? closeMenu() : openMenu();
        });
    
        nav.querySelectorAll('a').forEach(function (link) {
            link.addEventListener('click', closeMenu);
        });
    
        document.addEventListener('click', function (event) {
            if (nav.classList.contains('open') &&
                !nav.contains(event.target) &&
                !btn.contains(event.target)) {
                closeMenu();
            }
        });
    
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') closeMenu();
        });
    })();
    </script>
</body>
</html>
